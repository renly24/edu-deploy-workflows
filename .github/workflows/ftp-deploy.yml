name: FTP deploy (reusable)

# 教育用リポジトリ共通のデプロイ。Next.js の静的エクスポートをビルドし、
# FTP サーバーの digital/<フォルダー名>/ に FTPS でアップロードする。
#
# 呼び出し側（各教材リポジトリの .github/workflows/deploy-ftp.yml）:
#   jobs:
#     deploy:
#       uses: renly24/edu-deploy-workflows/.github/workflows/ftp-deploy.yml@main
#       secrets: inherit
#
# 前提: next.config.ts が basePath / assetPrefix を NEXT_PUBLIC_BASE_PATH から読み、
#       output: "export", distDir: "out" であること。
on:
  workflow_call:
    inputs:
      project-dir:
        description: "digital/ の下に作るフォルダー名。省略時はリポジトリ名"
        type: string
        default: ""
      node-version:
        type: string
        default: "20"
    secrets:
      FTP_HOST:
        required: true
      FTP_USER:
        required: true
      FTP_PASS:
        required: true

permissions:
  contents: read

env:
  # FTP のログイン直後のフォルダーは http://e.gmobb.jp/omaesensei/ として公開される
  PUBLIC_ORIGIN: http://e.gmobb.jp
  PUBLIC_ROOT: /omaesensei
  REMOTE_PARENT: digital
  # サーバー証明書は発行元が不明なため、この証明書（SHA-1 指紋）だけを信頼する。
  # 証明書が更新されたら、ここを新しい指紋に書き換える（全教材に反映される）。
  FTP_CERT_FINGERPRINT: "09:5C:41:9E:84:B7:C8:6D:37:F7:48:B4:27:BB:1B:43:89:D9:C2:24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ftp-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Resolve target folder
        id: target
        env:
          PROJECT_DIR: ${{ inputs.project-dir || github.event.repository.name }}
        run: |
          # --delete で他の教材を消さないよう、フォルダー名は 1 階層の安全な名前に限る
          if ! [[ "$PROJECT_DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [[ "$PROJECT_DIR" == *..* ]]; then
            echo "::error::Invalid project-dir: '$PROJECT_DIR'"
            exit 1
          fi
          echo "remote=$REMOTE_PARENT/$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "base=$PUBLIC_ROOT/$REMOTE_PARENT/$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Upload to: $REMOTE_PARENT/$PROJECT_DIR/"
          echo "Public URL: $PUBLIC_ORIGIN$PUBLIC_ROOT/$REMOTE_PARENT/$PROJECT_DIR/"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.target.outputs.base }}

      - name: Check the export uses the base path
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          test -f out/index.html || { echo "::error::out/index.html がありません（output: \"export\" / distDir: \"out\" を確認）"; exit 1; }
          grep -qF "\"$BASE/_next/" out/index.html \
            || { echo "::error::basePath が反映されていません（next.config.ts が NEXT_PUBLIC_BASE_PATH を読んでいるか確認）"; exit 1; }

      # FTP サーバーは名前に ".." を含むファイルを受け付けない（550 Not owner）ので、
      # ドットを 1 つにまとめて改名し、HTML / JS / CSS などの参照も書き換える
      - name: Rename files the FTP server rejects
        run: |
          node - out <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const TEXT_EXT = /\.(html|js|css|txt|json|map|xml|webmanifest)$/;
          const walk = (dir) =>
            fs.readdirSync(dir).flatMap((name) => {
              const p = path.join(dir, name);
              return fs.statSync(p).isDirectory() ? walk(p) : [p];
            });
          const files = walk(root);
          const renames = new Map();
          for (const p of files) {
            const name = path.basename(p);
            if (!name.includes("..")) continue;
            const fixed = name.replace(/\.{2,}/g, ".");
            if (files.includes(path.join(path.dirname(p), fixed))) {
              throw new Error(`Cannot rename ${p}: ${fixed} already exists`);
            }
            fs.renameSync(p, path.join(path.dirname(p), fixed));
            renames.set(name, fixed);
            console.log(`renamed ${p} -> ${fixed}`);
          }
          if (renames.size > 0) {
            for (const p of walk(root)) {
              if (!TEXT_EXT.test(p)) continue;
              const original = fs.readFileSync(p, "utf8");
              let text = original;
              for (const [from, to] of renames) text = text.split(from).join(to);
              if (text !== original) fs.writeFileSync(p, text);
            }
          }
          console.log(`${renames.size} file(s) renamed`);
          EOF

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
          REMOTE_DIR: ${{ steps.target.outputs.remote }}
        run: |
          # --delete はアップロード先フォルダーの中だけに効く（他の教材には触れない）
          lftp -c "
            set net:timeout 30; set net:max-retries 2;
            set ftp:ssl-force yes; set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no;
            open --env-password -u '$FTP_USER' '$FTP_HOST';
            mirror --reverse --delete --verbose --parallel=4 out/ '$REMOTE_DIR/'"

      - name: Check the published page
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          url="$PUBLIC_ORIGIN$BASE/"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
          echo "$code $url"
          test "$code" = 200
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
