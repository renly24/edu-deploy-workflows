name: Sync FTP secrets to repositories

# このリポジトリの FTP_HOST / FTP_USER / FTP_PASS を、指定した教材リポジトリの
# Secrets にコピーする（値は GitHub の中で暗号化されたまま移り、ログには出ない）。
# 必要な Secrets（このリポジトリ）: FTP_HOST, FTP_USER, FTP_PASS, SECRETS_SYNC_TOKEN
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "コピー先のリポジトリ名（スペース区切り）。all-edu で edu- で始まる全リポジトリ"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_SYNC_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          OWNER: ${{ github.repository_owner }}
          SELF: ${{ github.event.repository.name }}
          REPOS: ${{ inputs.repos }}
        run: |
          for name in GH_TOKEN FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name が空です（このリポジトリの Secrets を確認してください）"
              exit 1
            fi
          done
          if [ "$REPOS" = "all-edu" ]; then
            REPOS=$(gh repo list "$OWNER" --limit 200 --json name --jq '.[].name' | grep '^edu-' | grep -vx "$SELF" | tr '\n' ' ')
          fi
          [ -n "${REPOS// /}" ] || { echo "::error::コピー先がありません"; exit 1; }
          failed=0
          for repo in $REPOS; do
            if ! [[ "$repo" =~ ^[A-Za-z0-9._-]+$ ]] || [ "$repo" = "$SELF" ]; then
              echo "::error::不正なリポジトリ名: $repo"; failed=1; continue
            fi
            echo "== $OWNER/$repo"
            # 値はコマンドラインではなく標準入力で渡す
            if printf '%s' "$FTP_HOST" | gh secret set FTP_HOST -R "$OWNER/$repo" \
              && printf '%s' "$FTP_USER" | gh secret set FTP_USER -R "$OWNER/$repo" \
              && printf '%s' "$FTP_PASS" | gh secret set FTP_PASS -R "$OWNER/$repo"; then
              gh secret list -R "$OWNER/$repo"
              echo "- ✅ $repo" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$repo への登録に失敗しました"; echo "- ❌ $repo" >> "$GITHUB_STEP_SUMMARY"; failed=1
            fi
          done
          exit $failed
